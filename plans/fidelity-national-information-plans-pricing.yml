specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Fidelity National Information Services (FIS)
providerId: fidelity-national-information
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Financial Services
  - Payments
  - Banking
  - Capital Markets
  - Wealth Management
  - Risk and Compliance
  - Fortune 500
description: FIS exposes its banking, payments, capital markets, wealth, and risk/compliance APIs through
  the Code Connect API marketplace (codeconnect.fisglobal.com). Access is gated by partner agreements
  and authenticated developer credentials; FIS does not publish list pricing. Each API is sold as part
  of the broader product/platform contract with the financial institution or fintech consumer (e.g. Modern
  Banking Platform, FedNow integration via FIS, Worldpay-from-FIS payments). Self-service signup provides
  documentation only; production access requires a sales engagement.
notes: FIS does not publish any list prices for the Code Connect APIs. Plans below capture the commercial
  pattern (Developer signup → Partner / customer agreement → Enterprise platform contract).
sources:
  - https://codeconnect.fisglobal.com/
  - https://www.fisglobal.com/
plans:
  - id: fis-developer-portal
    name: Developer Portal Access
    type: freemium
    description: Self-service signup at codeconnect.fisglobal.com provides documentation, OpenAPI specs,
      and limited sandbox access; production data requires a partner / customer agreement.
    entries:
      - label: Developer access
        description: Documentation + sandbox / interactive API exploration; no production traffic.
        name: developer_access
        type: quota
        metric: requests
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: codeconnect.fisglobal.com signup
      - name: API documentation + OpenAPI specs
      - name: Sandbox access for selected APIs
  - id: fis-partner
    name: Partner / Customer Integration
    type: enterprise
    description: API entitlements are bundled with FIS product contracts (e.g. core banking, card processing,
      wealth platform). Pricing rolled into the platform contract; consumers do not see a separate API
      price.
    entries:
      - label: Bundled API entitlement
        description: API access included in the FIS platform / product contract; no separate per-call
          fee.
        name: bundled_api
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: FIS Code Connect API Marketplace
      - name: Production credentials
      - name: Bundled with FIS product contract (Modern Banking Platform / Worldpay / Capital Markets
          / Wealth)
  - id: fis-enterprise
    name: Enterprise Platform Contract
    type: enterprise
    description: Multi-product FIS platform contract for large financial institutions — covers core banking,
      payments, capital markets, wealth, risk/compliance APIs and managed services.
    entries:
      - label: Platform contract
        description: Negotiated multi-year platform contract; price varies by product mix, transaction
          volume, and managed-service scope.
        name: enterprise_contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: All FIS Code Connect APIs
      - name: Contractual SLA
      - name: Managed services
      - name: 24/7 support
      - name: Dedicated technical account manager
      - name: Data residency / regulatory options
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
