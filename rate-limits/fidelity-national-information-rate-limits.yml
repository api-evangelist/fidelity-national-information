specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Fidelity National Information Services (FIS)
providerId: fidelity-national-information
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Financial Services
  - Payments
  - Banking
  - Capital Markets
  - Wealth Management
  - Risk and Compliance
  - Rate Limiting
description: FIS does not publish global per-second rate limits in the public Code Connect documentation.
  Each API and each customer environment has limits specific to the product (core banking, card processing,
  capital markets) and the contracted volume. Sandbox endpoints have lower throughput than production;
  production limits are governed by the customer's contract and underlying platform sizing.
notes: No public per-second numbers. Rate limits are contract-bound; production throughput is sized to
  the customer's transaction volume in the underlying FIS platform (Modern Banking Platform, IBS, Profile,
  etc.).
sources:
  - https://codeconnect.fisglobal.com/
responseCodes:
  throttled: 429
  serverError: 500
  serviceUnavailable: 503
  unauthorized: 401
  forbidden: 403
limits:
  - name: Sandbox APIs (Code Connect Developer Portal)
    scope: developer-account
    metric: varies
    limit: per-developer test ceiling; not publicly published
    notes: Suitable for prototyping only.
  - name: Production banking / payments APIs
    scope: contract
    metric: varies
    limit: sized to the customer's contracted transaction volume; not publicly published
  - name: Capital Markets / Wealth APIs
    scope: contract
    metric: varies
    limit: sized to firm volume and platform deployment; not publicly published
  - name: Real-time payments (FedNow / RTP via FIS)
    scope: contract
    metric: varies
    limit: governed by the underlying clearing rails and customer's certified throughput
policies:
  - name: OAuth 2.0 / mTLS
    description: Authenticate with OAuth 2.0 and/or mutual TLS depending on API; rotate credentials before
      expiry.
  - name: Backoff on 429/503
    description: Exponential backoff with jitter on transient errors; honor Retry-After when present.
  - name: Idempotency
    description: Use idempotency keys on POST endpoints for payments and transfers to make retries safe.
  - name: Customer-environment sizing
    description: Production limits are sized to the customer's underlying platform deployment; raise via
      FIS service request and capacity review.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
