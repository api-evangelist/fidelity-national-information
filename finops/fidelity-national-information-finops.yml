description: 'FOCUS-aligned FinOps for FIS: cost is bundled into multi-year platform contracts covering
  core banking (Modern Banking Platform, IBS, Profile), payments (Worldpay-from-FIS, FedNow), capital
  markets, wealth, and risk/compliance products. The Code Connect APIs are entitlements within those
  contracts rather than a per-call billed product. FinOps focuses on transaction-volume tiering, professional-services
  spend, and managed-service tier selection rather than API-call meters.'
notes: FIS publishes no list prices. Reconcile FinOps values from the active FIS product contract and
  monthly invoice line items.
sources:
  - https://codeconnect.fisglobal.com/
  - https://www.fisglobal.com/
principles:
  - name: Visibility
    description: Pull monthly FIS invoices and reconcile against contracted volume tiers; track API call
      volume in Code Connect developer dashboards (where exposed); track transaction volume in the underlying
      product (e.g. card transactions in Worldpay reporting, payments in Modern Banking Platform reports).
  - name: Allocation
    description: Allocate FIS contract cost by line of business (retail banking, commercial banking, capital
      markets, wealth) and by contracted module; tag API calls by Code Connect application/consumer.
  - name: Optimization
    description: Right-size contract volume tiers each annual review; consolidate overlapping FIS products
      where possible; avoid redundant API integrations across teams; leverage included professional-services
      hours rather than buying additional engagements.
  - name: Accountability
    description: Vendor management / strategic sourcing owns the FIS master agreement; product line owners
      own per-module consumption; quarterly business reviews with FIS to true up volumes and identify
      optimization candidates.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Rate Optimization
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Multi-Year Platform Contract + Transaction Volume Tiers
  billingFrequency: Monthly (operating fees) + Annual (license / professional services)
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
    - Tax
  chargeFrequency: Recurring
focusColumns:
  ServiceName: FIS
  ServiceCategory: Financial Services Technology
  ProviderName: FIS
  PublisherName: Fidelity National Information Services, Inc.
  InvoiceIssuerName: Fidelity National Information Services, Inc.
  PricingCategory: Subscription + Transaction Volume
  PricingUnit: contract | transaction
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: api_calls
    description: Code Connect API call volume per consumer application (where reported).
    unit: call
    aggregation: sum
    dimensions:
      - api
      - application
      - environment
  - name: card_transactions
    description: Card transactions processed via Worldpay-from-FIS.
    unit: transaction
    aggregation: sum
    dimensions:
      - merchant
      - card_brand
      - country
  - name: payments
    description: Real-time / batch payments processed (FedNow, RTP, ACH via FIS).
    unit: payment
    aggregation: sum
    dimensions:
      - rail
      - originator
  - name: accounts_under_management
    description: Active deposit / wealth accounts on the FIS platform.
    unit: account
    aggregation: max
    dimensions:
      - product_module
  - name: professional_services_hours
    description: Consumed professional-services hours against the contracted bank.
    unit: hour
    aggregation: sum
    dimensions:
      - engagement
apis:
  - name: FIS Code Connect API Marketplace
    baseURL: https://codeconnect.fisglobal.com/
    serviceName: FIS Code Connect API Marketplace
    serviceCategory: API
unitEconomics:
  - name: Cost per Card Transaction (Worldpay)
    metric: card_processing_cost / card_transactions
    target: contract-dependent
  - name: Cost per Account / month (Modern Banking Platform)
    metric: platform_cost / accounts_under_management
    target: contract-dependent
  - name: PS Hours Burn vs. Contracted Bank
    metric: professional_services_hours / contracted_hours
    target: less than 100% before renewal
